worker_processes 1;

events {
  worker_connections 4096;
}

http {
  include /usr/local/etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    server_name localhost 192.168.3.21;

    # PHP Backend (member center APIs)
    location /member/ {
      proxy_pass http://192.168.3.21:9002/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Go Gateway (WebSocket / A2A / device)
    location /gateway/ {
      proxy_pass http://192.168.3.21:9001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # 显式配置 WebSocket 超时判定（配合客户端 30s 心跳机制）
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Static web fallback (optional)
    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html =404;
    }
  }
}
