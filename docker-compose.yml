# ============================================================
# EvoLoop 本地开发环境
# =========================== 注意事项 =========================
# 有状态中间件 (Postgres/Redis/Neo4j/Meilisearch) 请通过
# deploy/docker-compose.middleware.yml 或手动启动。
# ============================================================
services:
  backend:
    build:
      context: ./backend
    restart: always
    env_file:
      - .env
    environment:
      - EVOLOOP_APP_DATA_DIR=/root/.evoloop
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - POSTGRES_SERVER=host.docker.internal
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      # Neo4j, Redis & Meilisearch Config (Inject from .env if needed or defaults)
      - NEO4J_URI=bolt://host.docker.internal:7687 
      - REDIS_URL=redis://host.docker.internal:6379/0
      - MEILISEARCH_URL=http://host.docker.internal:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-}
    ports:
      - "${PORT}:${PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-evoloop-data:/root/.evoloop

  worker:
    build:
      context: ./backend
    restart: always
    env_file:
      - .env
    environment:
      - EVOLOOP_APP_DATA_DIR=/root/.evoloop
      - DOMAIN=${DOMAIN}
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - POSTGRES_SERVER=host.docker.internal
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - NEO4J_URI=bolt://host.docker.internal:7687 
      - REDIS_URL=redis://host.docker.internal:6379/0
      - MEILISEARCH_URL=http://host.docker.internal:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-}
    command: ["python", "bin/run.py", "worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-evoloop-data:/root/.evoloop

  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "${FRONTEND_DOCKER_PORT}:80"
    depends_on:
      - backend

volumes:
  app-evoloop-data:

