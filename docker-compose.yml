services:
  db:
    image: pgvector/pgvector:pg17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - app-redis-data:/data

  neo4j:
    image: neo4j:5.19.0
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - app-neo4j-data:/data

  # Micro-Skill: Agent-S
  skill-agent-s:
    build:
      context: ./skill_cells/agent_s
    env_file:
      - .env # Share env for API keys (OpenAI etc)
    environment:
      - OS_PROVIDER=${OS_PROVIDER}
      - OS_MODEL=${OS_MODEL}
      # Use internal docker dns for ground url if needed, or pass through
      - OS_GROUND_URL=${OS_GROUND_URL}
    ports:
      - "8001:8000" # Host 8001 -> Container 8000
    depends_on:
      - db
      - redis

  # Micro-Skill: Browser-Use
  skill-browser-use:
    build:
      context: ./skill_cells/browser_use
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8002:8000" # Host 8002 -> Container 8000
    depends_on:
      - db
      - redis

  # Micro-Skill: Open-AutoGLM
  skill-open-autoglm:
    build:
      context: ./skill_cells/open_autoglm
    env_file:
      - .env
    environment:
      - PHONE_AGENT_MODEL=${PHONE_AGENT_MODEL:-autoglm-phone-9b}
      - PHONE_AGENT_BASE_URL=${PHONE_AGENT_BASE_URL:-http://host.docker.internal:8000/v1}
      - PHONE_AGENT_API_KEY=${PHONE_AGENT_API_KEY:-EMPTY}
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037 # Attempt to use host ADB
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allow access to host
    ports:
      - "8003:8000" # Host 8003 -> Container 8000
    depends_on:
      - db

  # Micro-Skill: Crawl4AI
  skill-crawl4ai:
    build:
      context: ./skill_cells/crawl4ai
    env_file:
      - .env
    # Crawl4AI might not need specific env vars unless integrating with LLM directly inside?
    # Based on server.py, it just crawls.
    ports:
      - "8004:8000" # Host 8004 -> Container 8000
    depends_on:
      - db

  backend:
    build:
      context: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      # Neo4j & Redis Config (Inject from .env if needed or defaults)
      - NEO4J_URI=bolt://host.docker.internal:7687 
      - REDIS_URL=redis://host.docker.internal:6379/0
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  app-db-data:
  app-redis-data:
  app-neo4j-data:

