pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    repositories {
        maven { url 'http://maven.aliyun.com/repository/gradle-plugin'; allowInsecureProtocol = true }
        maven { url 'http://maven.aliyun.com/repository/public'; allowInsecureProtocol = true }
        maven { url 'http://maven.aliyun.com/repository/google'; allowInsecureProtocol = true }
        maven { url 'https://repo.huaweicloud.com/repository/maven' }
    }
}

plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'EvoLoopMobile'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url 'http://maven.aliyun.com/repository/google'; allowInsecureProtocol = true }
        maven { url 'http://maven.aliyun.com/repository/public'; allowInsecureProtocol = true }
        maven { url 'https://repo.huaweicloud.com/repository/maven' }
        maven { url 'https://repo.huaweicloud.com/repository/google' }
        // Essential Local Repositories for Autolinking and prebuilt AARs
        maven {
            url "../node_modules/react-native/android"
        }
        maven {
            url "../node_modules/@notifee/react-native/android/libs"
        }
        maven {
            url "../node_modules/jsc-android/dist"
        }
        maven {
            url "../node_modules/@react-native-async-storage/async-storage/android/local_repo"
        }
    }
}

include ':app'

includeBuild("../node_modules/@react-native/gradle-plugin")

