[project]
name = "evoloop-client"
version = "0.1.0"
description = "EvoLoop Client - Local Agent Daemon"
requires-python = ">=3.11,<4.0"
dependencies = [
    # --- Core Framework ---
    # REMOVED: FastAPI (server-only, client uses daemon mode)
    "pydantic[email]>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "httpx[http2]>=0.25.1,<1.0.0",
    "tenacity>=8.2.3",
    "jinja2<4.0.0,>=3.1.4",
    "sentry-sdk>=1.40.6", # Removed fastapi extra
    # --- Database (Client: SQLite Only) ---
    "sqlmodel>=0.0.21,<1.0.0",
    "aiosqlite>=0.20.0", # Async SQLite support
    # REMOVED: alembic - SQLite doesn't need migrations
    # REMOVED: psycopg, asyncpg, pgvector - Server only
    # --- Vector Database (LanceDB for Client) ---
    "lancedb>=0.15.0,<0.26.0", # 0.29+ doesn't support macOS x86_64
    "pyarrow>=15.0.0", # Required by LanceDB
    # --- LangChain / LLM ---
    "langchain>=1.2.3",
    "langchain-core>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.7",
    "langchain-anthropic>=1.3.1",
    # REMOVED: langchain-postgres, langchain-neo4j - Server only
    # REMOVED: langgraph-checkpoint-postgres - Server only
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    # --- Code Analysis ---
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-php>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-swift>=0.0.1",
    "tree-sitter-sql>=0.3.11",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-language-pack>=0.13.0",
    # --- Utilities ---
    "watchdog>=4.0.0",
    "mcp>=1.0.0",
    "anytree>=2.12.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "markdownify>=0.11.0",
    "rich>=13.0.0",
    # REMOVED: celery, redis, neo4j - Server only
    "mammoth>=1.6.0",
    "rapidfuzz>=3.14.3",
    "websockets>=13.0,<15.0",
    "pathspec>=0.12.0",
    "pyright>=1.1.408", # Runtime dependency for LSP tool
    "psutil>=5.9.0",
    "docker>=7.1.0",
    "requests>=2.32.5",
    "croniter>=6.0.0",
    # --- macOS Specific (Client) ---
    "pyobjc-framework-quartz>=12.1",
    "imagehash>=4.3.2",
    "keyring>=25.0.0",
    "pyobjc-framework-vision>=12.1",
    "pyobjc>=12.1",
    # --- Browser Automation ---
    "playwright>=1.40.0",
    # --- Security ---
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
]

[tool.uv]
dev-dependencies = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # Code quality
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pyinstaller>=6.18.0",  # For building client executable
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
target-version = "py311"
# REMOVED: exclude alembic (deleted)

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# REMOVED: tests patterns (tests deleted)
"scripts/**/*.py" = ["T201"]

# REMOVED: coverage config (tests deleted)

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
