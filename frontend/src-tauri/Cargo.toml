[package]
name = "EvoLoop"
version = "0.7.0"
description = "EvoLoop"
authors = ["you"]
edition = "2021"
default-run = "EvoLoop"

[lib]
name = "evoloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
# TTS/STT handled via custom Tauri commands (speak_text, etc.) and native sherpa-onnx
dirs = "6.0.0"
tauri-plugin-global-shortcut = "2.3.2"
msedge-tts = { version = "0.4.0", features = ["tokio-runtime"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
xcap = "0.0.9" # Cross-platform screen capture
base64 = "0.22" # For encoding images
image = "0.25" # For image processing
active-win-pos-rs = "0.8" # Active window info
# parking_lot removed — needs 100+ pattern rewrites, deferred
macos-accessibility-client = "0.0.2" # Check accessibility permissions
libc = "0.2" # For sending SIGINT to stop screen recording
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
rdev = "0.5" # Used by recorder binary for global event capture
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# lazy_static removed — replaced with std::sync::LazyLock

# Full-duplex voice
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
sherpa-onnx = { path = "../../../sherpa-onnx/sherpa-onnx/rust/sherpa-onnx", default-features = false }
cpal = "0.16"
rubato = "0.16"
hound = "3.5"
ringbuf = "0.4"
arboard = "3.4"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.13"
core-graphics = "0.24"
cocoa = "0.25"
objc = "0.2.7"


