[package]
name = "EvoLoop"
version = "0.6.0"
description = "EvoLoop"
authors = ["you"]
edition = "2021"
default-run = "EvoLoop"

[lib]
name = "evoloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-stt = { git = "https://github.com/brenogonzaga/tauri-plugin-stt" }
tauri-plugin-tts = { git = "https://github.com/brenogonzaga/tauri-plugin-tts" }
dirs = "6.0.0"
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
xcap = "0.0.9" # Cross-platform screen capture
base64 = "0.22" # For encoding images
image = "0.25" # For image processing
rdev = "0.5" # Global keyboard/mouse listener
active-win-pos-rs = "0.8" # Active window info
parking_lot = "0.12" # Efficient mutex
macos-accessibility-client = "0.0.2" # Check accessibility permissions
libc = "0.2" # For sending SIGINT to stop screen recording
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
lazy_static = "1.4"

