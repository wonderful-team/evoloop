# pytest configuration file
[pytest]
# Test paths
testpaths = tests

# Python path for imports
pythonpath = .

# Default options
addopts =
    -v
    --tb=short
    -ra
    --strict-markers
    -p no:warnings

# Async mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test collection
test_classes = Test*
test_functions = test_*
test_files = test_*.py

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires external services)
    e2e: End-to-end tests (full system)
    slow: Slow tests (>1s, skipped by default)
    asyncio: Async tests
    llm: Tests requiring LLM mocking
    db: Tests requiring database
    neo4j: Tests requiring Neo4j
    redis: Tests requiring Redis
    no_external_services: Tests that don't require external services (embedded mode)
    performance: Performance tests
    stability: Stability tests
    security: Security tests
    benchmark: Benchmark tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Timeout for tests (in seconds - requires pytest-timeout)
timeout = 60

# Coverage settings (if using pytest-cov)
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore paths
norecursedirs = .venv venv build dist *.egg __pycache__ .git .tox node_modules

# Console output
console_output_style = count
