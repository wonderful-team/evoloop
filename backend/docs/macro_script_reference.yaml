# ============================================================================
# 宏脚本完整参考 — Macro Script Full Reference
# ============================================================================
# 格式：YAML
# 版本：1.0
# 执行引擎：MacroEngine (app/core/execution/macro/engine)
#
# 宏是确定性脚本（非 LLM），由 MacroEngine 逐步骤执行。
# 系统支持 7 种步骤类型 + 30+ 动作类型。
# ============================================================================

# ─── 元数据 ──────────────────────────────────────────────────────────────
version: '1.0'
metadata:
  format: evoloop-macro
  step_count: 10

# ─── 步骤列表 ────────────────────────────────────────────────────────────
steps:
  # ═════════════════════════════════════════════════════════════════════════
  # 1. NAVIGATE — 页面导航
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 1
    type: action
    source: dom                       # 执行源：dom | mobile | os
    event_type: navigate              # 导航到 URL
    payload:
      url: '{{base_url}}/sysuser/list'  # 完整 URL，{{base_url}} 由 project.json.url 注入
      wait_until: load                  # load | domcontentloaded | networkidle
      timeout_ms: 30000                 # 超时毫秒
    # 可用变量：
    #   {{base_url}}          — 项目部署地址，从 .evoloop/project.json 的 url 字段读取
    #   {{parameters.X}}      — 运行时参数，由 run_macro(params={"X": val}) 传入
    #   {{extracted.key}}     — 前序 extract 步骤提取的数据
    #   {{query}}             — 用户查询文本（search_entity 模板用）

  # ═════════════════════════════════════════════════════════════════════════
  # 2. CLICK — 点击元素
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 2
    type: action
    source: dom
    event_type: click
    target_selector: '#submit-btn'      # CSS 选择器，支持 #id、.class、[name='x']、text=标签文本
    payload:
      button: left                      # left | middle | right
      clicks: 1                         # 点击次数（双击用 2）
      modifiers: []                     # 修饰键：shift | control | alt | meta
      delay_after_ms: 500               # 点击后等待
      timeout_ms: 10000
    # 选择器类型（由 AppMap element.selector_type 决定）：
    #   #id               → id 选择器
    #   [name='x']        → name 属性
    #   .class-name       → class 选择器
    #   [lay-filter='x']  → layui 过滤器
    #   text=标签文本      → 文本匹配
    #   [data-x-id]       → 自定义属性

  # ═════════════════════════════════════════════════════════════════════════
  # 3. INPUT — 输入文本
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 3
    type: action
    source: dom
    event_type: input
    target_selector: '[name="username"]'
    payload:
      text: '{{parameters.username}}'    # 输入文本，支持变量注入
      append: false                      # true=追加，false=替换
      enter: true                        # 输入后按回车
      delay_after_ms: 200

  # ═════════════════════════════════════════════════════════════════════════
  # 4. SELECT_OPTION — 下拉选择
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 4
    type: action
    source: dom
    event_type: select_option
    target_selector: '[name="status"]'
    payload:
      text: '{{parameters.status}}'      # 选中指定文本的 option
      delay_after_ms: 200

  # ═════════════════════════════════════════════════════════════════════════
  # 5. WAIT — 等待
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 5
    type: action
    source: dom
    event_type: wait
    payload:
      seconds: 2                          # 固定等待秒数
      wait_until: load                    # 或等待页面加载
      timeout_ms: 30000

  # ═════════════════════════════════════════════════════════════════════════
  # 6. EXTRACT — 提取数据（两阶段宏的关键）
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 6
    type: extract
    source: dom
    extract_type: text                    # text | attribute | html | links | screenshot
    target_selector: '.goods-price'
    key: price                            # 提取结果存入 {{extracted.price}}
    payload:
      attribute: textContent              # 提取的属性名
      wait_for_selector: '.goods-price'   # 等待元素出现
      timeout_ms: 5000
    # 提取的值可在后续步骤中通过 {{extracted.key}} 引用

  # ═════════════════════════════════════════════════════════════════════════
  # 7. LOOP — 循环（遍历列表页）
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 7
    type: loop
    source: dom
    payload:
      items_key: items                    # 数据提取结果的 key
      max_iterations: 10                  # 最大循环次数
      max_retries: 3                      # 失败重试
      backoff_base: 2.0                   # 退避系数
    # 子步骤在 then_steps 中定义，会对 items 中的每一项执行
    then_steps:
      - step_number: 7.1
        type: action
        source: dom
        event_type: click
        target_selector: '{{item.link}}'  # 使用当前循环项的字段
      - step_number: 7.2
        type: extract
        source: dom
        extract_type: text
        target_selector: '.detail-title'
        key: detail_title

  # ═════════════════════════════════════════════════════════════════════════
  # 8. IF — 条件分支
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 8
    type: if
    source: dom
    condition:
      type: element_exists                # 条件类型：element_exists | text_matches
      target_selector: '.error-message'
    then_steps:                           # 条件为真时执行
      - step_number: 8.1
        type: action
        source: dom
        event_type: click
        target_selector: '#close-btn'
    else_steps:                           # 条件为假时执行
      - step_number: 8.2
        type: action
        source: dom
        event_type: wait
        payload:
          seconds: 1

  # ═════════════════════════════════════════════════════════════════════════
  # 9. SCREENSHOT — 截图（调试/验证）
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 9
    type: action
    source: dom
    event_type: screenshot
    payload:
      region:                             # 可选：截图区域
        x: 0
        y: 0
        w: 800
        h: 600

  # ═════════════════════════════════════════════════════════════════════════
  # 10. OPEN_APP — 打开本地应用（非浏览器场景）
  # ═════════════════════════════════════════════════════════════════════════
  - step_number: 10
    type: action
    source: os
    event_type: open_app
    payload:
      package_name: 'com.example.app'     # Android 包名 / macOS bundle ID
      app_name: '设置'                     # 应用名称（中文也支持）

# ============================================================================
# 变量引用总表
# ============================================================================
# 变量                     来源                        示例
# ───────────────────────────────────────────────────────────────────────────
# {{base_url}}               .evoloop/project.json.url   http://localhost:8080
# {{parameters.name}}        run_macro(params=...)       用户传入参数
# {{extracted.key}}          extract 步骤产出           上一页提取的数据
# {{query}}                  search 模板特有             用户搜索词
# {{entity_cn}}              template 生成时填充         中文实体名（模板残留）
# {{item.field}}             loop 步骤中当前项属性      items[n].link
# ───────────────────────────────────────────────────────────────────────────
#
# 步骤类型总表
# ───────────────────────────────────────────────────────────────────────────
# type        说明
# action      通用动作（navigate / click / input / wait / ...）
# extract     数据提取（text / attribute / html / screenshot）
# loop        循环（遍历列表、分页）
# if          条件分支
# control     控制流（高级）
# dump        数据导出
# native      原生执行（特殊场景）
# ───────────────────────────────────────────────────────────────────────────
#
# 常用 action event_type 总表
# ───────────────────────────────────────────────────────────────────────────
# event_type           所属域        说明
# navigate             browser       导航到 URL
# click                browser       点击元素
# input / type_text    browser       输入文本
# select_option        browser       下拉选择
# wait / wait_for      browser       等待
# scroll               browser       滚动
# key_press            browser       按键
# new_tab / switch_tab browser       标签页操作
# upload               browser       上传文件
# run_js               browser       执行 JavaScript
# screenshot           browser       截图
# open_app             os            打开应用
# close_app            os            关闭应用
# mouse_click          os            鼠标点击
# applescript          macOS         AppleScript 执行
# ax_press             macOS AX      无障碍按下
# ax_set_value         macOS AX      无障碍设置值
# ============================================================================
