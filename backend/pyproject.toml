[project]
name = "evoloop-backend"
version = "0.1.0"
description = "EvoLoop Backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx[http2]>=0.25.1,<1.0.0",
    "sqlmodel>=0.0.21,<1.0.0",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.3.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "pyjwt<3.0.0,>=2.8.0",
    # EvoLoop Dependencies
    "langchain>=1.2.3",
    "langchain-core>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.7",
    "langchain-anthropic>=1.3.1",
    "tree-sitter>=0.23.0",
    "google-genai>=1.0.0", # Adjusted version constraint for broad compatibility
    "openai>=1.30.0",
    # Task Queue (Embedded mode: Huey + SQLite, Full mode: Celery + Redis)
    "huey>=2.5.0", # Lightweight task queue for embedded mode
    "anthropic>=0.25.0",
    "edge-tts>=7.0.0", # Text-to-Speech (Microsoft Edge, free)
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-php>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-swift>=0.0.1",
    "tree-sitter-sql>=0.3.11",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-language-pack>=0.13.0",
    "watchdog>=4.0.0",
    "mcp>=1.0.0",
    "anytree>=2.12.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "markdownify>=0.11.0",
    "rich>=13.0.0",
    "mammoth>=1.6.0",
    "rapidfuzz>=3.14.3",
    "websockets>=13.0,<15.0",
    "pathspec>=0.12.0",
    "pyright>=1.1.408", # Runtime dependency for LSP tool
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Last version with macOS x86_64 wheels
    "torch>=2.4.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # "adaptive-classifier>=0.1.2", # Removed (replaced with LLM classifier)
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # torch 2.2.2 incompatible with numpy 2.x
    "psutil>=5.9.0",
    "docker>=7.1.0",
    "requests>=2.32.5",
    "pyobjc-framework-quartz>=12.1; sys_platform == 'darwin'",
    "imagehash>=4.3.2",
    "keyring>=25.0.0",
    "pyobjc-framework-vision>=12.1; sys_platform == 'darwin'",
    "pyobjc>=12.1; sys_platform == 'darwin'",
    "playwright>=1.40.0",
    "croniter>=6.0.0",
    "googlesearch-python>=1.2.3",
    "PyYAML>=6.0.1",
    "yamllint>=1.35.1",
    # --- Embedded Mode Dependencies (No External Services) ---
    "aiosqlite>=0.20.0", # Async SQLite support
    "lancedb>=0.15.0,<0.26.0", # Embedded vector database
    "pyarrow>=15.0.0", # Required by LanceDB
    "ddgs>=9.11.4",
    "beautifulsoup4>=4.12.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-checkpoint-postgres>=3.0.4",
    "pgvector>=0.3.6",
    "aiofiles>=25.1.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "redis>=7.1.0",
    "itsdangerous>=2.2.0",
    "networkx>=3.6.1",
    "sentence-transformers>=5.5.0",
    "transformers<5.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "einops>=0.8.2",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
# Full mode with all external services
full = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.6",
    "neo4j>=5.20.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "meilisearch>=0.31.0",
    "langchain-postgres>=0.0.9",
    "langchain-neo4j>=0.7.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-checkpoint-postgres>=3.0.4",
]
# Embedded mode only (lighter, no external deps)
embedded = [
    # Core dependencies already include aiosqlite, lancedb, pyarrow
    "networkx>=3.0",  # Graph data structure for file-based graph
]

[dependency-groups]
dev = [
    "pytest<9.0.0,>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "faker>=23.0.0",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
    "pyinstaller>=6.18.0",
    "vcrpy>=8.1.1",
    "pytest-recording>=0.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201", "E501"]
"scripts/**/*.py" = ["T201"]
"verify_*.py" = ["T201"]
"check_*.py" = ["T201"]
"export_openapi.py" = ["T201"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
