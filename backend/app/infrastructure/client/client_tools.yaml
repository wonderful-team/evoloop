# Client-side tools that require local environment access.
# Used as fallback when no capability negotiation has occurred.
#
# Priority:
#   1. WebSocket/HTTP capability negotiation (runtime)
#   2. This list (fallback for backward compatibility)

# Exact tool names — matched verbatim
exact:
  # File operations
  - file_read
  - file_write
  - file_list
  - file_edit
  - file_delete
  - file_search
  - file_search_name
  - file_open
  # Shell execution
  - shell
  - shell_execute
  # Python execution (local only)
  - python_execute
  - exec_python
  # ADB (Android Debug Bridge)
  - adb_connect
  - adb_shell
  - adb_screenshot
  - adb_tap
  - adb_swipe
  - adb_dump_ui
  - adb_input
  - adb_key
  - adb_get_current_app
  # Browser automation
  - browser_navigate
  - browser_click
  - browser_type
  - browser_screenshot
  - browser_get_html
  - browser_get_url
  - browser_back
  - browser_forward
  - browser_refresh
  - browser_close
  # Desktop automation
  - desktop_screenshot
  - desktop_click
  - desktop_type
  - desktop_key
  - desktop_get_cursor
  # MCP tool execution
  - mcp
  # Context retrieval
  - get_context

# Prefix patterns — matched with startswith
prefixes:
  - adb_
  - browser_
  - desktop_
  - mcp__
