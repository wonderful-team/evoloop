name: "evoloop_primary"
version: "2.0"
state_schema: "app.core.workflows.state.AgentState"

# Interrupt configuration (Empty by default to prevent stalls, enable if HITL is needed)
interrupt_before: []

nodes:
  - id: "router"
    path: "app.core.workflows.nodes.router.router_node"
    
  - id: "supervisor"
    path: "app.core.workflows.nodes.supervisor.supervisor_node"

  - id: "coder"
    path: "app.core.workflows.nodes.coder.coder_node"
  
  - id: "tester"
    path: "app.core.workflows.nodes.tester.tester_node"
    
  - id: "deep_researcher"
    path: "app.core.workflows.nodes.deep_researcher.deep_researcher_node"

  - id: "documenter"
    path: "app.core.workflows.nodes.documenter.documenter_node"

  - id: "meta_reviewer"
    path: "app.core.workflows.nodes.meta_reviewer.meta_reviewer_node"

  - id: "finish"
    path: "app.core.workflows.nodes.finish.finish_node"

  # Executor Nodes
  - id: "browser_executor"
    path: "app.core.workflows.nodes.executors.browser_executor"
  - id: "computer_executor"
    path: "app.core.workflows.nodes.executors.computer_executor"
  - id: "mobile_executor"
    path: "app.core.workflows.nodes.executors.mobile_executor"

edges:
  # 1. Router (L1 Dispatch)
  - from: "router"
    type: "conditional"
    router: "app.core.workflows.routers.route_by_next_node_field"
    map:
      supervisor: "supervisor"
      browser_executor: "browser_executor"
      computer_executor: "computer_executor"
      mobile_executor: "mobile_executor"
  
  # 2. Executors -> Supervisor (Return path)
  - from: "browser_executor"
    to: "supervisor"
    type: "simple"
  - from: "computer_executor"
    to: "supervisor"
    type: "simple"
  - from: "mobile_executor"
    to: "supervisor"
    type: "simple"

  # 3. Supervisor (L2 Dispatch)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.workflows.routers.route_supervisor"
    map:
      coder: "coder"
      deep_researcher: "deep_researcher"
      documenter: "documenter"
      supervisor: "supervisor"
      finish: "finish"

  # 4. Deep Researcher (Loop)
  - from: "deep_researcher"
    type: "conditional"
    router: "app.core.workflows.routers.route_by_next_node_field"
    map:
      deep_researcher: "deep_researcher"
      supervisor: "supervisor"

  # 5. Coder -> Tester
  - from: "coder"
    to: "tester"
    type: "simple"

  # 6. Tester
  - from: "tester"
    type: "conditional"
    router: "app.core.workflows.routers.route_tester"
    map:
      supervisor: "supervisor"
      coder: "coder"
      meta_reviewer: "meta_reviewer"

  # 7. Documenter & MetaReviewer -> Supervisor
  - from: "documenter"
    to: "supervisor"
    type: "simple"
  - from: "meta_reviewer"
    to: "supervisor"
    type: "simple"

  # 8. Finish
  - from: "finish"
    to: "END"
    type: "simple"
