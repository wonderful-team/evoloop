# Macro and local response strings used by the L0 routing layer.
#
# These were previously hardcoded in app/core/routing/actions.py and
# app/core/routing/channels/voice.py.  Moving them to a data file makes it easy
# to adjust copy/TTS without code changes. Templates use Python `.format()`
# placeholders.

macro:
  not_found: 未找到该宏
  timeout: 执行超时
  success: 完成
  failure: 执行失败

local:
  success: 好的

# Generic channel confirmations used by both voice and web adapters.
generic:
  ok: 好的
  cancel: 已取消

