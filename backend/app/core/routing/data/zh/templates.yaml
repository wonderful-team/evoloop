voice_local_actions:
- id: paste
  params: {}
- id: speak
  params: {}
templates: []
# 口语填充词（可叠加剥离）：匹配前从用户语音中去除的礼貌/客套/口语前缀与后缀。
polite_prefixes: [请, 帮我, 麻烦, 帮忙, 把, 给我, 帮我把, 帮我给, 我想, 我要, 麻烦把, 帮我去]
polite_suffixes: [一下, 一下下, 一下儿, 吧, 呀, 啊, 呗, 嘛]
# 槽位值清洗词：从提取出的槽位值中去除的口语填充（动词后的"一下"、指代词等）。
slot_filler_prefixes: [一下, 一会儿, 这个, 那个, 这些, 那些, 然后, 并且, 再]
slot_filler_suffixes: [一下, 谢谢, 吧, 啊, 嘛, 呀, 呗]
# 应用名后缀噪声：匹配到应用名后剥离（"微信浏览器" → "微信"）。
app_suffix_noise: [浏览器, 软件, app, APP, App]
# 自由文本槽位拒绝词：防止 打开{dir}/访问{site} 吞掉应用名或指代词。
free_text_reject_markers: [这个, 那个, 这些, 那些, 什么, 哪里, 哪个, 哪个文件]
# 指代标记：判断本轮是否依赖前文（L1 指代消解输入）。等价于原代码内
# 正则（它|它们|它的 / 这[个件] / 那[个件] 等），启动时编译。
anaphora_markers: [它, 它们, 它的, 他, 他们, 他的, 她, 她们, 她的, 这个, 这件, 那个, 那件, 这些, 那些, 刚才, 之前, 上次, 前面]
# 槽位余料字符：map-slot 余料仅允许这些填充字符（按 slot 名）。
slot_filler_chars:
  delta: 调给我到一点下把
  key: 键一下
