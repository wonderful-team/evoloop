# Builtin and macro response strings used by the L0 routing layer (English).
# Templates use Python `.format()` placeholders.

builtin:
  ack: Okay
  cancel_success: Cancelled
  cancel_empty: No active task
  rename: "Okay, call me {name} from now on"
  rename_no_name: Okay
  end: Goodbye
  clarify: Please say that again
  unknown: "unknown builtin action: {action}"

macro:
  not_found: Macro not found
  timeout: Execution timed out
  success: Done
  failure: Execution failed

local:
  success: Okay

# Generic channel confirmations used by both voice and web adapters.
generic:
  ok: Okay
  cancel: Cancelled
