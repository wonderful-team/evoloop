# Intent overrides and keyword data for the Layer-0 router (English).

# Context-aware intent redirect: when BERT predicts a vague intent (e.g. record)
# we look at the currently active application/phone and redirect to a concrete
# intent name that will be resolved against DB macros.
context_map:
  record:
    __default__: ""
    __phone__: phone screen recording
    QuickTime Player: start screen recording
  play:
    __default__: ""
    Music: play music
    Spotify: play music
  next_track:
    __default__: ""
    Music: next track
    Spotify: next track

# BERT intent labels that map to built-in L0 actions (ack, cancel, end, clarify, rename).
builtin_aliases:
  cancel: cancel
  end: end
  clarify: clarify
  rename: rename

# BERT intent label that is always treated as a complex query and delegated to the agent.
complex_query_intent: complex_query

# Intents that require a guard regex to be present in the text before being accepted.
# Extend with English labels as the model is trained.
intent_guards:
  time_report: "(what|which) (time|day|date|weekday)"

# Intents that allow device keyword redirects to override candidate macro resolution.
device_intent_trigger_intents:
  - open_app
  - enable_WiFi
  - open_messages
  - close_app
  - disable_WiFi
  - switch_app

# Canonical built-in L0 actions used by the decision builder.
builtin_actions:
  - ack
  - cancel
  - end
  - clarify
  - rename

# Device keyword redirects: when a device keyword is present in the text and
# the predicted intent is one of the open/switch/close intents, prefer these
# candidate intent names for macro resolution.
device_intents:
  WiFi:
    - turn on WiFi
    - turn off WiFi
    - enable WiFi
    - disable WiFi
  bluetooth:
    - turn on bluetooth
    - turn off bluetooth
  bluetooth_device:
    - connect bluetooth device
    - disconnect bluetooth device

# English prefixes that are stripped when extracting a slot value from raw text.
slot_prefixes:
  - open
  - launch
  - start
  - close
  - quit
  - exit
  - switch to
  - go to
  - search
  - search for

