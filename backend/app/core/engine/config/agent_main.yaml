name: "evoloop_functional"
version: "3.0"
state_schema: "app.core.engine.state.AgentState"

interrupt_before: []

nodes:
  - id: "supervisor"
    path: "app.core.engine.nodes.supervisor.SupervisorNode"
    tools:
      - "route_to"
      # - "update_blackboard"
      - "manage_session_metadata"
      - "spawn_agents"
      - "decompose_task"
      - "aggregate_results"
      - "search_skills"
      - "create_plan"
      - "ask_confirm"
      - "ask_human"

  - id: "worker"
    path: "app.core.engine.nodes.worker.WorkerNode"
    tools:
      # =====================================================================
      # 🏅 WORKER BASELINE CAPABILITY POOL (v5.0 Unified Architecture)
      # =====================================================================
      # This is the global capacity pool. The Supervisor selects and 
      # explicitly authorizes a subset of these tools via the `route_to` call
      # based on the current mission and environment telemetry.
      # =====================================================================
      # Orchestration & State (Unified Engine Controls)
      # - "update_blackboard"
      - "manage_session_metadata"
      - "spawn_agents"
      # Desktop & Mobile Automation
      - "desktop_control"
      - "mobile_control"
      - "analyze_image"
      - "verify_ui_state"
      - "browser_control"
      # Workspace & Code
      - "read_file"
      - "write_file"
      - "edit_file"
      - "multiedit_file"
      - "apply_patch_file"
      - "list_directory"
      - "manage_directory"
      - "search_files"
      - "execute_command"
      # Code Exploration (Unified Layer - replaces consult_lsp, explore_codebase)
      - "find_symbol"
      - "ask_codebase"
      - "analyze_impact"
      - "check_types"
      - "inspect_symbol"
      # Checkpoints
      - "create_checkpoint"
      - "list_checkpoints"
      - "rollback_checkpoint"
      - "delete_checkpoint"
      # Context Management (Agent-controlled forgetting for long tasks)
      - "forget_tool_outputs"
      - "recall_tool_output"
      - "list_forgotten_outputs"
      # Knowledge & Memory (Simple remember/recall)
      - "remember"
      - "recall"
      - "search_history"
      - "search_skills"
      - "run_macro"
      - "query_app_atlas"
      - "list_app_atlas"
      - "search_native_tools"
      - "save_concepts"
      # Wiki (Project documentation authoring)
      - "write_wiki_page"
      - "list_wiki_pages"
      - "read_wiki_page"
      # Knowledge Base (Document reference and search)
      - "kb_read"
      - "kb_search"
      - "kb_list"
      # Research
      - "search_web"
      # Planning & Audit
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "consult_architecture"
      # Planning & Todo (Individual tools replacing manage_todo facade)
      - "create_todo"
      - "list_todos"
      - "complete_todo"
      - "cancel_todo"
      # Control
      - "ask_confirm"
      - "ask_human"
      - "wait_for"
      - "delegate_periodic_intent"
      - "inspect_task_health"
      - "list_autonomous_tasks"

  - id: "finish"
    path: "app.core.engine.nodes.finish.FinishNode"
    tools:
      - "read_file"
      - "list_directory"
      - "create_todo"
      - "list_todos"
      - "complete_todo"
      - "cancel_todo"
      - "synthesize_skill"

  - id: "chat"
    path: "app.core.engine.nodes.chat.ChatNode"
    tools:
      # Chat Node: Lightweight memory tools only
      # NO file operations, browser, desktop, or command execution
      - "recall"           # Search long-term memory
      - "remember"         # Save information to memory
      - "search_history"   # Search current conversation history

  - id: "aggregator"
    path: "app.core.engine.nodes.aggregator.AggregatorNode"

edges:
  # 1. Supervisor (Router)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.engine.routers.route_supervisor"
    map:
      chat: "chat"
      supervisor: "supervisor"
      finish: "finish"
      worker: "worker"
      aggregator: "aggregator"
      spawn_subtasks: "worker"  # Dynamic subtasks map to worker (handled by Send)

  # 2. Worker -> Supervisor (Worker reports back to Supervisor for next decision)
  - from: "worker"
    to: "supervisor"
    type: "simple"

  # 3. Chat -> End
  - from: "chat"
    to: "END"
    type: "simple"

  # 4. Finish -> Supervisor/End (Conditional Loopback)
  - from: "finish"
    type: "conditional"
    router: "app.core.engine.routers.route_finish"
    map:
      supervisor: "supervisor"
      END: "END"

  # 5. Aggregator -> Supervisor (Aggregator reports merged results back)
  - from: "aggregator"
    to: "supervisor"
    type: "simple"


