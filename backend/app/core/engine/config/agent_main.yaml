name: "evoloop_functional"
version: "3.0"
state_schema: "app.core.engine.state.AgentState"

interrupt_before: []

nodes:
  - id: "supervisor"
    path: "app.core.engine.nodes.supervisor.supervisor_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_memory"
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "consult_architecture"
      - "request_approval"
      - "learn_skill_from_trace"
      - "explore_codebase"
      - "grep_files"
      - "query_app_atlas"
      - "list_app_atlas"
      - "get_app_usage_ranker"
      - "search_native_tools"
      - "get_workspace_tree"
      - "route_to"
      - "recall_memory"
      - "update_focus"
      - "memorize"

  - id: "operator"
    path: "app.core.engine.nodes.operator.operator_node"
    tools:
      - "read_file"
      - "write_file"
      - "edit_file"
      - "list_files"
      - "file_system"
      - "consult_lsp"
      - "manage_git"
      - "manage_memory"
      - "consult_architecture"
      - "request_approval"
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "explore_codebase"
      - "grep_files"
      - "query_app_atlas"
      - "list_app_atlas"
      - "bash"
      - "search_native_tools"
      - "get_workspace_tree"
      - "search_skills"

  - id: "deep_researcher"
    path: "app.core.engine.nodes.deep_researcher.deep_researcher_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_memory"
      - "crawl_url"
      - "search_web"
      - "explore_codebase"
      - "grep_files"

  - id: "documenter"
    path: "app.core.engine.nodes.documenter.documenter_node"
    tools:
      - "read_file"
      - "list_files"
      - "write_document"
      - "edit_document"
      - "list_wiki_pages"
      - "read_wiki_page"
      - "write_wiki_page"
      - "harvest_knowledge"
      - "manage_memory"
      - "explore_codebase"
      - "grep_files"

  - id: "finish"
    path: "app.core.engine.nodes.finish.finish_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_todo"
      - "harvest_knowledge"
      - "finalize_session"

  - id: "chat"
    path: "app.core.engine.nodes.chat.chat_node"

  - id: "flash_brain"
    path: "app.core.brain.node.flash_brain_node"

  - id: "dynamic_specialist"
    path: "app.core.engine.nodes.dynamic_specialist.dynamic_specialist_node"

edges:
  # 1. Supervisor (Router)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.engine.routers.route_supervisor"
    map:
      operator: "operator"
      deep_researcher: "deep_researcher"
      documenter: "documenter"
      chat: "chat"
      supervisor: "supervisor"
      finish: "finish"
      flash_brain: "flash_brain"
      dynamic_specialist: "dynamic_specialist"

  # 2. Operator Loop (Self-Correcting)
  # Operator node handles its own loops via max_steps.
  # When it returns, it yields control back to Supervisor.
  - from: "operator"
    to: "supervisor"
    type: "simple"

  # 3. Researcher
  - from: "deep_researcher"
    to: "supervisor"
    type: "simple"

  # 4. Documenter
  - from: "documenter"
    to: "supervisor"
    type: "simple"

  # 5. Chat -> End
  - from: "chat"
    to: "END"
    type: "simple"

  # 6. Finish -> End
  - from: "finish"
    to: "END"
    type: "simple"

  # 7. Flash Brain -> Supervisor
  - from: "flash_brain"
    to: "supervisor"
    type: "simple"

  # 8. Dynamic Specialist -> Supervisor
  - from: "dynamic_specialist"
    to: "supervisor"
    type: "simple"

# Additional role mappings for non-graph nodes (used by SkillExecutor, etc.)
role_tools:
  coder:
    - "read_file"
    - "write_file"
    - "edit_file"
    - "list_files"
    - "file_system"
    - "consult_lsp"
    - "manage_git"
    - "manage_memory"
    - "consult_architecture"
    - "request_approval"
    - "explore_codebase"
    - "grep_files"
    - "search_native_tools"

  planner:
    - "read_file"
    - "list_files"
    - "create_plan"
    - "update_step_status"
    - "analyze_feasibility"
    - "consult_architecture"
    - "request_approval"
    - "explore_codebase"
    - "grep_files"
    - "query_app_atlas"
    - "list_app_atlas"
    - "search_native_tools"

  researcher:
    - "read_file"
    - "list_files"
    - "manage_memory"
    - "crawl_url"
    - "search_web"
    - "explore_codebase"
    - "grep_files"

  requirement_analyst:
    - "read_file"
    - "list_files"
    - "write_document"
    - "edit_document"
    - "manage_memory"
    - "explore_codebase"
    - "grep_files"

  tester:
    - "read_file"
    - "write_file"
    - "edit_file"
    - "list_files"
    - "manage_memory"
    - "explore_codebase"
    - "grep_files"
