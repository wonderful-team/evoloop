name: "evoloop_functional"
version: "3.0"
state_schema: "app.core.engine.state.AgentState"

interrupt_before: []

nodes:
  - id: "supervisor"
    path: "app.core.engine.nodes.supervisor.supervisor_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_memory"
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "consult_architecture"
      - "request_approval"
      - "learn_skill_from_trace"
      - "explore_codebase"
      - "grep_files"
      - "query_app_atlas"
      - "list_app_atlas"
      - "get_app_usage_ranker"
      - "search_native_tools"
      - "get_workspace_tree"
      - "route_to"
      - "recall_memory"
      - "update_focus"
      - "memorize"

  - id: "worker"
    path: "app.core.engine.nodes.worker.worker_node"
    tools:
      # Universal Worker Toolkit (v5 — gated at runtime by ExecutionTicket)
      # Desktop & Mobile Automation
      - "desktop_control"
      - "mobile_control"
      - "analyze_image"
      - "verify_ui_state"
      # Workspace & Code
      - "read_file"
      - "write_file"
      - "edit_file"
      - "list_files"
      - "file_system"
      # - "bash"
      - "consult_lsp"
      - "manage_git"
      - "explore_codebase"
      - "grep_files"
      - "get_workspace_tree"
      # Knowledge & Memory
      - "manage_memory"
      - "search_skills"
      - "query_app_atlas"
      - "list_app_atlas"
      - "search_native_tools"
      - "memorize_concepts"
      # Research
      - "search_web"
      # Planning & Audit
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "consult_architecture"
      - "manage_todo"
      - "finalize_session"
      # Control
      - "request_approval"
      - "use_mcp_server"
      - "wait"

  - id: "documenter"
    path: "app.core.engine.nodes.documenter.documenter_node"
    tools:
      - "read_file"
      - "list_files"
      - "write_document"
      - "edit_document"
      - "list_wiki_pages"
      - "read_wiki_page"
      - "write_wiki_page"
      - "memorize_concepts"
      - "manage_memory"
      - "explore_codebase"
      - "grep_files"

  - id: "finish"
    path: "app.core.engine.nodes.finish.finish_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_todo"
      - "memorize_concepts"
      - "finalize_session"

  - id: "chat"
    path: "app.core.engine.nodes.chat.chat_node"

  - id: "flash_brain"
    path: "app.core.brain.node.flash_brain_node"

edges:
  # 1. Supervisor (Router)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.engine.routers.route_supervisor"
    map:
      documenter: "documenter"
      chat: "chat"
      supervisor: "supervisor"
      finish: "finish"
      flash_brain: "flash_brain"
      worker: "worker"

  # 2. Worker -> Supervisor
  - from: "worker"
    to: "supervisor"
    type: "simple"

  # 3. Documenter
  - from: "documenter"
    to: "supervisor"
    type: "simple"

  # 4. Chat -> End
  - from: "chat"
    to: "END"
    type: "simple"

  # 5. Finish -> End
  - from: "finish"
    to: "END"
    type: "simple"

  # 6. Flash Brain -> Supervisor
  - from: "flash_brain"
    to: "supervisor"
    type: "simple"

# Role-specific tool profiles (v5 Unified Roles)
# Used by ToolManager to hydrate tools for the Universal Worker based on its current persona.
role_tools:
  operator:
    - "read_file"
    - "write_file"
    - "edit_file"
    - "list_files"
    - "file_system"
    - "bash"
    - "consult_lsp"
    - "manage_git"
    - "manage_memory"
    - "consult_architecture"
    - "request_approval"
    - "create_plan"
    - "update_step_status"
    - "analyze_feasibility"
    - "explore_codebase"
    - "grep_files"
    - "get_workspace_tree"
    - "search_skills"
    - "use_mcp_server"
    - "wait"

  deep_researcher:
    - "read_file"
    - "list_files"
    - "manage_memory"
    - "search_web"
    - "explore_codebase"
    - "grep_files"
    - "search_skills"

  documenter:
    - "read_file"
    - "list_files"
    - "write_document"
    - "edit_document"
    - "list_wiki_pages"
    - "read_wiki_page"
    - "write_wiki_page"
    - "memorize_concepts"
    - "manage_memory"
    - "explore_codebase"
    - "grep_files"

  finish:
    - "read_file"
    - "list_files"
    - "manage_todo"
    - "memorize_concepts"
    - "finalize_session"

  "MacOS Automation Specialist":
    - "desktop_control"
    - "analyze_image"
    - "query_app_atlas"
    - "list_app_atlas"
    - "search_native_tools"
    - "request_approval"
    # - "request_human_input"
