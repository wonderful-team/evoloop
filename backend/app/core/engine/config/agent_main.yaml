name: "evoloop_functional"
version: "3.0"
state_schema: "app.core.engine.state.AgentState"

interrupt_before: []

nodes:
  - id: "supervisor"
    path: "app.core.engine.nodes.supervisor.supervisor_node"
    tools:
      - "route_to"
      # - "update_blackboard"
      - "manage_session_metadata"
      - "spawn_agents"
      - "decompose_task"
      - "aggregate_results"
      - "get_environment_telemetry"
      - "search_native_tools"
      - "search_skills"
      - "create_plan"
      - "update_step_status"
      - "manage_memory"
      - "request_approval"
      - "request_human_input"
      - "get_workspace_tree"
      - "list_autonomous_tasks"

  - id: "worker"
    path: "app.core.engine.nodes.worker.worker_node"
    tools:
      # =====================================================================
      # 🏅 WORKER BASELINE CAPABILITY POOL (v5.0 Unified Architecture)
      # =====================================================================
      # This is the global capacity pool. The Supervisor selects and 
      # explicitly authorizes a subset of these tools via the `route_to` call
      # based on the current mission and environment telemetry.
      # =====================================================================
      # Orchestration & State (Unified Engine Controls)
      # - "update_blackboard"
      - "manage_session_metadata"
      - "spawn_agents"
      # Desktop & Mobile Automation
      - "desktop_control"
      - "mobile_control"
      - "analyze_image"
      - "verify_ui_state"
      - "browser_control"
      # Workspace & Code
      - "read_file"
      - "write_file"
      - "edit_file"
      - "preview_edit"
      - "list_files"
      - "file_system"
      - "bash"
      - "consult_lsp"
      - "manage_git"
      - "explore_codebase"
      - "grep_files"
      - "get_workspace_tree"
      # Checkpoints
      - "create_checkpoint"
      - "list_checkpoints"
      - "rollback_checkpoint"
      - "delete_checkpoint"
      # Ghost Text
      - "suggest_inline_completion"
      - "preview_edit_ghost"
      # Knowledge & Memory
      - "manage_memory"
      - "search_skills"
      - "run_macro"
      - "query_app_atlas"
      - "list_app_atlas"
      - "search_native_tools"
      - "memorize_concepts"
      # Research
      - "search_web"
      # Planning & Audit
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "consult_architecture"
      - "manage_todo"
      # Control
      - "request_approval"
      - "request_human_input"
      - "use_mcp_server"
      - "wait_for"
      - "delegate_periodic_intent"
      - "inspect_task_health"
      - "list_autonomous_tasks"

  - id: "finish"
    path: "app.core.engine.nodes.finish.finish_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_todo"
      - "memorize_concepts"
      - "synthesize_skill"

  - id: "chat"
    path: "app.core.engine.nodes.chat.chat_node"

  - id: "flash_brain"
    path: "app.core.brain.node.flash_brain_node"

  - id: "aggregator"
    path: "app.core.engine.nodes.aggregator.aggregator_node"

edges:
  # 1. Supervisor (Router)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.engine.routers.route_supervisor"
    map:
      chat: "chat"
      supervisor: "supervisor"
      finish: "finish"
      flash_brain: "flash_brain"
      worker: "worker"
      aggregator: "aggregator"
      spawn_subtasks: "worker"  # Dynamic subtasks map to worker (handled by Send)

  # 2. Worker -> Supervisor (Worker reports back to Supervisor for next decision)
  - from: "worker"
    to: "supervisor"
    type: "simple"

  # 3. Chat -> End
  - from: "chat"
    to: "END"
    type: "simple"

  # 4. Finish -> END (always terminal)
  - from: "finish"
    to: "END"
    type: "simple"

  # 5. Aggregator -> Supervisor (Aggregator reports merged results back)
  - from: "aggregator"
    to: "supervisor"
    type: "simple"

  # 6. Flash Brain -> Supervisor
  - from: "flash_brain"
    to: "supervisor"
    type: "simple"


