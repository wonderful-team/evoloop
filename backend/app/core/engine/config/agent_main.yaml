name: "evoloop_functional"
version: "3.0"
state_schema: "app.core.engine.state.AgentState"

interrupt_before: []

nodes:
  - id: "supervisor"
    path: "app.core.engine.nodes.supervisor.supervisor_node"

  - id: "developer"
    path: "app.core.engine.nodes.developer.developer_node"

  - id: "deep_researcher"
    path: "app.core.engine.nodes.deep_researcher.deep_researcher_node"

  - id: "documenter"
    path: "app.core.engine.nodes.documenter.documenter_node"

  - id: "finish"
    path: "app.core.engine.nodes.finish.finish_node"

  - id: "chat"
    path: "app.core.engine.nodes.chat.chat_node"

edges:
  # 1. Supervisor (Router)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.engine.routers.route_supervisor"
    map:
      developer: "developer"
      deep_researcher: "deep_researcher"
      documenter: "documenter"
      chat: "chat"
      supervisor: "supervisor"
      finish: "finish"

  # 2. Developer Loop (Self-Correcting)
  # Developer node handles its own loops via max_steps.
  # When it returns, it yields control back to Supervisor.
  - from: "developer"
    to: "supervisor"
    type: "simple"

  # 3. Researcher
  - from: "deep_researcher"
    to: "supervisor"
    type: "simple"

  # 4. Documenter
  - from: "documenter"
    to: "supervisor"
    type: "simple"

  # 5. Chat -> End
  - from: "chat"
    to: "END"
    type: "simple"

  # 6. Finish -> End
  - from: "finish"
    to: "END"
    type: "simple"
