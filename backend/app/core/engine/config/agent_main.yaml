name: "evoloop_functional"
version: "3.0"
state_schema: "app.core.engine.state.AgentState"

interrupt_before: []

nodes:
  - id: "supervisor"
    path: "app.core.engine.nodes.supervisor.supervisor_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_memory"
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "consult_architecture"
      - "request_approval"
      - "learn_skill_from_trace"
      - "explore_codebase"
      - "grep_files"
      - "query_app_atlas"
      - "list_app_atlas"
      - "get_app_usage_ranker"
      - "search_native_tools"
      - "get_workspace_tree"
      - "route_to"
      - "recall_memory"
      - "update_focus"
      - "memorize"

  - id: "worker"
    path: "app.core.engine.nodes.worker.worker_node"
    tools:
      # =====================================================================
      # 🏅 WORKER BASELINE CAPABILITY POOL (v5.0 - Plan B Architecture)
      # =====================================================================
      # This is NOT the final tool list the Worker receives. 
      # The Supervisor intercepts these tools during `route_to('worker')`.
      # 1. It masks cross-platform tools based on the current `ecosystem` focus.
      # 2. It forcibly injects any generic tools strictly required by the matched SOPs.
      # The resulting strict Allowlist is passed via `ExecutionTicket.agent_config.tools`.
      # =====================================================================
      # Desktop & Mobile Automation
      - "desktop_control"
      - "mobile_control"
      - "analyze_image"
      - "verify_ui_state"
      - "browser_control"
      # Workspace & Code
      - "read_file"
      - "write_file"
      - "edit_file"
      - "list_files"
      - "file_system"
      # - "bash"
      - "consult_lsp"
      - "manage_git"
      - "explore_codebase"
      - "grep_files"
      - "get_workspace_tree"
      # Knowledge & Memory
      - "manage_memory"
      - "search_skills"
      - "query_app_atlas"
      - "list_app_atlas"
      - "search_native_tools"
      - "memorize_concepts"
      # Research
      - "search_web"
      # Planning & Audit
      - "create_plan"
      - "update_step_status"
      - "analyze_feasibility"
      - "consult_architecture"
      - "manage_todo"
      # Control
      - "request_approval"
      - "use_mcp_server"
      - "wait"

  - id: "finish"
    path: "app.core.engine.nodes.finish.finish_node"
    tools:
      - "read_file"
      - "list_files"
      - "manage_todo"
      - "memorize_concepts"

  - id: "chat"
    path: "app.core.engine.nodes.chat.chat_node"

  - id: "flash_brain"
    path: "app.core.brain.node.flash_brain_node"

edges:
  # 1. Supervisor (Router)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.engine.routers.route_supervisor"
    map:
      chat: "chat"
      supervisor: "supervisor"
      finish: "finish"
      flash_brain: "flash_brain"
      worker: "worker"

  # 2. Worker -> Supervisor
  - from: "worker"
    to: "supervisor"
    type: "simple"

  # 3. Chat -> End
  - from: "chat"
    to: "END"
    type: "simple"

  # 4. Finish -> END (always terminal)
  - from: "finish"
    to: "END"
    type: "simple"

  # 6. Flash Brain -> Supervisor
  - from: "flash_brain"
    to: "supervisor"
    type: "simple"


