name: "evoloop_functional"
version: "3.0"
state_schema: "app.core.engine.state.AgentState"

interrupt_before: []

tool_bundles:
  file_tools:
    - "list_dir"
    - "find_files"
    - "read_file"
    - "write_file"
    - "edit_file"
    - "move_file"
    - "delete_file"
    - "grep_search"
    - "execute_command"
  browser_tools:
    - "browser_control"
    - "clipboard"
    - "desktop_control"
    - "analyze_image"
    - "verify_ui_state"
  desktop_tools:
    - "desktop_control"
    - "open_app"
    - "clipboard"
    - "analyze_image"
  mobile_tools:
    - "mobile_control"
    - "list_devices"
    - "analyze_image"
  knowledge_tools:
    - "remember"
    - "recall"
    - "search_history"
    - "list_skills"
    - "read_skill_sop"
    - "query_app_atlas"
    - "list_app_atlas"
    - "save_concepts"
    - "kb_read"
    - "kb_search"
  planning_tools:
    - "create_plan"
    - "update_step_status"
    - "create_todo"
    - "list_todos"
    - "complete_todo"
    - "cancel_todo"

nodes:
  - id: "supervisor"
    path: "app.core.engine.nodes.supervisor.SupervisorNode"
    tools:
      - "route_to"
      - "decompose_task"
      - "update_blackboard"
      - "list_skills"
      - "read_skill_sop"
      - "search_history"
      - "search_web"
      - "read_file"
      - "list_dir"
      - "grep_search"
      - "find_files"
      - "create_plan"
      - "ask_confirm"
      - "ask_human"

  - id: "worker"
    path: "app.core.engine.nodes.worker.WorkerNode"
    tools:
      # =====================================================================
      # 🏅 WORKER BASELINE CAPABILITY POOL (v5.0 Unified Architecture)
      # =====================================================================
      # This is the global capacity pool. The Supervisor selects and 
      # explicitly authorizes a subset of these tools via the `route_to` call
      # based on the current mission and environment telemetry.
      # =====================================================================
      # Orchestration & State (Unified Engine Controls)
      # Desktop & Mobile Automation
      - "update_blackboard"
      - "desktop_control"
      - "mobile_control"
      - "analyze_image"
      - "verify_ui_state"
      - "browser_control"
      # Workspace & Code
      - "read_file"
      - "write_file"
      - "edit_file"
      - "list_dir"
      - "grep_search"
      - "find_files"
      - "execute_command"
      # Code Exploration (Unified Layer - replaces consult_lsp, explore_codebase)
      - "find_symbol"
      - "ask_codebase"
      # Context Management (Agent-controlled forgetting for long tasks)
      - "forget_tool_outputs"
      - "recall_tool_output"
      - "list_forgotten_outputs"
      - "write_handover_notes"
      # Knowledge & Memory (Simple remember/recall)
      - "remember"
      - "recall"
      - "search_history"
      - "list_skills"
      - "read_skill_sop"
      - "run_macro"
      - "query_app_atlas"
      - "list_app_atlas"
      - "search_native_tools"
      - "save_concepts"
      - "sql_query"
      # Wiki (Project documentation authoring)
      - "write_wiki_page"
      - "edit_wiki_page"
      - "list_wiki_pages"
      - "read_wiki_page"
      # Project Management & Task Breakdown
      - "create_project_tasks"
      # Knowledge Base (Document reference and search)
      - "kb_read"
      - "kb_search"
      - "kb_list"
      # Research
      - "search_web"
      # Planning & Audit
      - "create_plan"
      - "update_step_status"
      # Planning & Todo (Individual tools replacing manage_todo facade)
      - "create_todo"
      - "list_todos"
      - "complete_todo"
      - "cancel_todo"
      # Control
      - "ask_confirm"
      - "ask_human"
      - "wait_for"
      - "inspect_task_health"
      - "list_scheduled_tasks"
      - "schedule_periodic_task"

  - id: "finish"
    path: "app.core.engine.nodes.finish.FinishNode"
    streaming: false
    tools:
      - "read_file"
      - "list_dir"
      - "grep_search"
      - "find_files"
      - "find_symbol"
      - "ask_codebase"
      - "search_history"
      - "list_skills"
      - "read_skill_sop"
      - "run_macro"
      - "synthesize_skill"
      - "verify_ui_state"

  - id: "chat"
    path: "app.core.engine.nodes.chat.ChatNode"
    tools:
      # Chat Node: Lightweight memory tools only
      # NO file operations, browser, desktop, or command execution
      - "recall"           # Search long-term memory
      - "remember"         # Save information to memory
      - "search_history"   # Search current conversation history

  - id: "aggregator"
    path: "app.core.engine.nodes.aggregator.AggregatorNode"

  - id: "sequential_workflow"
    path: "app.core.engine.nodes.sequential_workflow.SequentialWorkflowNode"

edges:
  # 1. Supervisor (Router)
  - from: "supervisor"
    type: "conditional"
    router: "app.core.engine.routers.route_supervisor"
    map:
      chat: "chat"
      supervisor: "supervisor"
      finish: "finish"
      worker: "worker"
      aggregator: "aggregator"
      sequential_workflow: "sequential_workflow"
      spawn_subtasks: "supervisor" # Loopback to supervisor if sends fails
      # NOTE: route_supervisor may also return list[Send] for dynamic subtask
      # spawning.  This is handled directly by LangGraph (not via this map).
      # See app.core.engine.routers._build_subtask_sends for details.

  # 2. Worker -> Supervisor/Finish (outcome-based)
  - from: "worker"
    type: "conditional"
    router: "app.core.engine.routers.route_worker_by_outcome"
    map:
      supervisor: "supervisor"
      finish: "finish"

  # 3. SequentialWorkflow -> SequentialWorkflow/Finish/Supervisor (Conditional)
  - from: "sequential_workflow"
    type: "conditional"
    router: "app.core.engine.routers.route_by_next_node"
    map:
      sequential_workflow: "sequential_workflow"
      finish: "finish"
      supervisor: "supervisor"

  # 4. Chat -> Finish/End (Conditional — ensures audit lifecycle runs for chat too)
  - from: "chat"
    type: "conditional"
    router: "app.core.engine.routers.route_by_next_node"
    map:
      finish: "finish"
      END: "END"

  # 5. Finish -> Supervisor/End (Conditional Loopback)
  - from: "finish"
    type: "conditional"
    router: "app.core.engine.routers.route_finish"
    map:
      supervisor: "supervisor"
      END: "END"

  # 6. Aggregator -> Supervisor (Aggregator reports merged results back)
  - from: "aggregator"
    to: "supervisor"
    type: "simple"


