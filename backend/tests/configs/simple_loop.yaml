name: "POC Dynamic Loop"
version: "0.1"
state_schema: "app.core.workflows.state.AgentState"

nodes:
  - id: "coder"
    path: "app.core.workflows.nodes.coder.coder_node"

  - id: "tester"
    path: "app.core.workflows.nodes.tester.tester_node"
  
  # Mock Supervisor for simple routing? Or just manually route.
  # Let's include supervisor for generic test
  - id: "sup"
    path: "app.core.workflows.nodes.supervisor.supervisor_node"
  
  - id: "finish"
    path: "app.core.workflows.nodes.finish.finish_node"

edges:
  # Entry point assumed first node unless SetEntryPoint used.
  # Let's try to mimic parts of the real graph.
  
  # Coder -> Tester
  - from: "coder"
    to: "tester"

  # Tester -> Router (mocking logic)
  - from: "tester"
    type: "conditional"
    router: "app.core.workflows.routers.route_tester"
    map:
      supervisor: "finish" # Short circuit for POC
      coder: "coder"
      meta_reviewer: "finish"

  # Minimal supervisor
  - from: "sup"
    to: "coder"
