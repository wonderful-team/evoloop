name: "Generic Writer"
version: "1.0"
nodes:
  - id: "writer"
    path: "app.core.workflows.nodes.generic.GenericLLMNode"
    config:
      system_prompt: "You are a creative poet. Write a short 4-line poem about the content of the file provided by the user tools."
      tools: ["read_file"]
      model: "gpt-4o"
      temperature: 0.9

  - id: "finish"
    path: "app.core.workflows.nodes.finish.finish_node"

edges:
  - from: "writer"
    to: "finish"
