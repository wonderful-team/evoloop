name: "Manager"
version: "1.0"
nodes:
  - id: "manager"
    path: "app.core.workflows.nodes.generic.GenericLLMNode"
    config:
      system_prompt: "You are a manager. Delegate the task to the squad."
      tools: []
      model: "gpt-4o"

  - id: "squad"
    type: "subgraph"
    subgraph_config: "team_squad.yaml" # Relative path

  - id: "finish"
    path: "app.core.workflows.nodes.finish.finish_node"

edges:
  - from: "manager"
    to: "squad"
  - from: "squad"
    to: "finish"
