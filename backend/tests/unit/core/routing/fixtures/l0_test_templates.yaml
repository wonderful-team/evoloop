voice_local_actions:
- id: paste
  params: {}
- id: speak
  params: {}
- id: clarify
  params: {}
- id: rename
  params:
    name: str
- id: end
  params: {}
- id: ack
  params: {}
- id: cancel
  params: {}
templates:
- action: play_pause
  patterns:
  - 暂停
  - 停一下
  - 别放了
  - 先停
  - 先停一下
  slots: {}
  args:
    state: pause
- action: play_pause
  patterns:
  - 继续
  - 继续播放
  - 接着放
  slots: {}
  args:
    state: resume
- action: next_track
  patterns:
  - 下一首
  - 下一曲
  - 切歌
  - 切下一首
  - 换一首
  slots: {}
- action: prev_track
  patterns:
  - 上一首
  - 上一曲
  - 回上一首
  slots: {}
- action: unmute
  patterns:
  - 取消静音
  - 恢复声音
  - 别静音
  slots: {}
- action: mute
  patterns:
  - 静音
  - 关闭声音
  - 关掉声音
  - 别出声
  slots: {}
- action: set_volume
  patterns:
  - 音量{delta}
  - 声音{delta}
  slots:
    delta: str
- action: screenshot
  patterns:
  - 截图
  - 截屏
  - 截个图
  - 屏幕截图
  slots: {}
- action: lock_screen
  patterns:
  - 锁屏
  - 锁定屏幕
  - 锁一下屏幕
  - 锁电脑
  slots: {}
- action: press_key
  patterns:
  - 按{key}
  - 按一下{key}
  - 按下{key}
  - 按一下{key}键
  slots:
    key: str
- action: open_app
  patterns:
  - 打开{app}
  - 启动{app}
  - 开一下{app}
  slots:
    app: str
- action: focus_app
  patterns:
  - 切换到{app}
  - 切到{app}
  - 回到{app}
  slots:
    app: str
- action: quit_app
  patterns:
  - 退出{app}
  - 关闭{app}
  - 关掉{app}
  slots:
    app: str
- action: clarify
  patterns:
  - 再说一遍
  - 没听清
  - 重说
  slots: {}
- action: rename
  patterns:
  - 你以后叫{name}
  - 改名{name}
  - 你的名字是{name}
  slots:
    name: str
- action: end
  patterns:
  - 再见
  - 拜拜
  - 结束
  - 退出对话
  slots: {}
- action: ack
  patterns:
  - 对对对
  - 没错
  - 就这个
  - 可以
  - 对的
  - 是的
  slots: {}
- action: cancel
  patterns:
  - 算了
  - 不用了
  - 不要
  - 取消
  slots: {}
slot_dictionaries:
  delta:
    大一点: '+10'
    大点: '+10'
    高一点: '+10'
    响一点: '+10'
    响点: '+10'
    调高: '+10'
    小一点: '-10'
    小点: '-10'
    低一点: '-10'
    轻一点: '-10'
    调低: '-10'
    最大: '100'
    最大声: '100'
    最小: '0'
    最小声: '0'
    一半: '50'
    全部: '100'
    关闭: '0'
  key:
    回车: Return
    回车键: Return
    空格: Space
    Esc: Escape
    Tab: Tab
    Command+C: Command+C
    Command+Q: Command+Q
    Command+V: Command+V
    Command+A: Command+A
    Command+Z: Command+Z
    Command+X: Command+X
aliases:
  音乐: Apple Music
  浏览器: Safari
