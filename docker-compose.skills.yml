  skill-crawl4ai:
    build:
      context: ./skill_cells/crawl4ai
      dockerfile: Dockerfile
    container_name: skill-crawl4ai
    image: evoloop/skill-crawl4ai:latest
    ports:
      - "8093:8000"
    environment:
      - FASTMCP_HOST=0.0.0.0
    volumes:
      - ./skill_cells/crawl4ai/server.py:/app/server.py
    networks:
      - evoloop-net
#
  skill-open-autoglm:
    build:
      context: ./skill_cells/open_autoglm
      dockerfile: Dockerfile
    container_name: skill-open-autoglm
    image: evoloop/skill-open-autoglm:latest
    ports:
      - "8094:8000"
    environment:
      - PHONE_AGENT_API_KEY=${PHONE_AGENT_API_KEY}
      - FASTMCP_HOST=0.0.0.0
    volumes:
      - ./skill_cells/open_autoglm/server.py:/app/server.py
    networks:
      - evoloop-net

networks:
  evoloop-net:
    driver: bridge
