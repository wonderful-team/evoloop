services:
  skill-agent-s:
    build: 
      context: ./skill_cells/agent_s
      dockerfile: Dockerfile
    container_name: skill-agent-s
    image: evoloop/skill-agent-s:latest
    ports:
      - "8091:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OS_PROVIDER=openai
      - OS_MODEL=gpt-4o
      - FASTMCP_HOST=0.0.0.0
    volumes:
      - ./skill_cells/agent_s/server.py:/app/server.py
    networks:
      - evoloop-net

